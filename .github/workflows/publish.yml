name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'usercao/vite-oxc-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
      - name: Set package version from release
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$RELEASE_VERSION" == [vV]* ]]; then
            echo "::error::Release tag must be an npm version without a v prefix, for example 0.6.1"
            exit 1
          fi
          yarn version "$RELEASE_VERSION" --immediate
          package_version="$(node --print "require('./package.json').version")"
          if [ "$package_version" != "$RELEASE_VERSION" ]; then
            echo "::error::Release tag must be a complete npm semantic version, for example 0.6.1"
            exit 1
          fi
      - run: yarn check
      - run: npm publish
