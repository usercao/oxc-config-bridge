name: Update Oxc toolchain

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-oxc-tools
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'usercao/oxc-config-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Upgrade oxfmt and oxlint
        run: npm install --save-dev oxfmt@latest oxlint@latest

      - name: Stop if no dependency changes
        id: changes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.changes.outputs.changed == 'true'
        run: npm test

      - if: steps.changes.outputs.changed == 'true'
        name: Commit and push updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: upgrade oxfmt and oxlint'
          git push