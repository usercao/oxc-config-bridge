name: Update Oxc toolchain

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-oxc-tools
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'usercao/vite-oxc-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: yarn
          cache-dependency-path: yarn.lock

      - run: corepack enable
      - run: yarn install --immutable

      - name: Upgrade Oxc toolchain
        run: yarn up --no-time-gate oxfmt oxlint oxlint-tsgolint

      - name: Stop if no dependency changes
        id: changes
        run: |
          if git diff --quiet -- package.json yarn.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.changes.outputs.changed == 'true'
        run: yarn format

      - if: steps.changes.outputs.changed == 'true'
        run: yarn check

      - if: steps.changes.outputs.changed == 'true'
        name: Commit and push updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json yarn.lock
          git add -u
          git commit -m 'chore: upgrade oxfmt and oxlint'
          git push
